name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      # Split compile from run: the test pipeline dies with a bare
      # `error: fatalError` and zero diagnostics right after
      # `Emitting module BuboTests` — deterministic across runs and
      # parallelism levels. Separating the phases pins which one dies,
      # and SWIFT_BACKTRACE makes any crashing Swift subprocess print
      # a real backtrace instead of failing silently.
      - name: Build tests
        env:
          SWIFT_BACKTRACE: enable=yes
        run: swift build --build-tests

      - name: Test
        env:
          SWIFT_BACKTRACE: enable=yes
        run: swift test --skip-build

      - name: Build release
        run: swift build -c release
