name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      # Split compile from run: the test pipeline dies with a bare
      # `error: fatalError` and zero diagnostics right after
      # `Emitting module BuboTests` — deterministic across runs and
      # parallelism levels. Separating the phases pins which one dies,
      # and SWIFT_BACKTRACE makes any crashing Swift subprocess print
      # a real backtrace instead of failing silently.
      - name: Build tests
        env:
          SWIFT_BACKTRACE: enable=yes
        run: swift build --build-tests

      # --no-parallel is a DIAGNOSTIC setting: the parallel swift-testing
      # phase keeps dying to one deterministic trap per run (a queue of
      # never-executed tests with fatal bugs), and parallel output makes
      # the crasher unattributable. Serial runs put the crash right after
      # the culprit's name. Re-enable parallel once the suite survives a
      # full serial pass.
      - name: Test
        env:
          SWIFT_BACKTRACE: enable=yes
        run: swift test --skip-build --no-parallel

      - name: Build release
        run: swift build -c release
