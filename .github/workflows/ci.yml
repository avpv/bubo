name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      # --jobs 2: the BuboTests module (76 files, heavy Swift Testing
      # macro expansion) dies at the emit-module step with a bare
      # `error: fatalError` and zero diagnostics at default parallelism
      # on the 7 GB GitHub macOS runners — the OOM-killed-frontend
      # signature. Verbose output + pipefail keep the real crash text
      # visible if it ever recurs.
      - name: Test
        run: |
          set -o pipefail
          swift test --jobs 2 -v 2>&1 | tail -n 600

      - name: Build release
        run: swift build -c release
