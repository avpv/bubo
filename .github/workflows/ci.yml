name: CI

# The default branch is `main` — with the triggers pinned to the
# never-existing `master`, CI silently skipped every push and PR
# (discovered on #593, which merged with zero check runs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Build release
        run: swift build -c release
